# =====================================================================
# Anchor workspace - astroid-lounge-payouts
# =====================================================================
# This file lives at the repo root because Anchor expects it there.
# The actual program lives under programs/astroid-lounge-payouts.
#
# DO NOT DEPLOY without:
#   1. A third-party security audit of programs/astroid-lounge-payouts.
#   2. A complete TypeScript client + integration test suite covering
#      every instruction (init, fund, set_winners, claim, cancel).
#   3. A counsel review of the on-chain payout flow against the
#      operator's gaming/promotional framework.
#   4. A multisig (or hardware-wallet-backed) operator authority -
#      the program intentionally trusts the operator pubkey for state
#      transitions, so that key cannot be a hot key on a server.
#
# The program ID below is a placeholder (LoungePayouts1...). Generate
# a real one with `anchor keys list` after `anchor init`.
# =====================================================================

[toolchain]
anchor_version = "0.31.1"
solana_version = "2.0.15"

[features]
resolution = true
skip-lint = false

[programs.localnet]
astroid_lounge_payouts = "LoungePayouts1111111111111111111111111111111"

[programs.devnet]
astroid_lounge_payouts = "LoungePayouts1111111111111111111111111111111"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "Localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 programs/client/tests/**/*.ts"

[test]
startup_wait = 5000
shutdown_wait = 2000
upgradeable = false

[test.validator]
url = "https://api.devnet.solana.com"
